# Production stack: PostgreSQL + app. Secrets come from .env.production (not in git).
services:
  db:
    image: postgres:16-alpine
    container_name: jamejam-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jamejam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: jamejam
    volumes:
      - jamejam-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamejam -d jamejam"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jamejam-prod-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jamejam:${POSTGRES_PASSWORD}@db:5432/jamejam?schema=public
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Business dates (today()) in Dubai time, same as the jobs service (TS-03).
      TZ: Asia/Dubai
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  # Scheduled jobs (TJ-01): PI expiry, session clean-up, stock = GL check. Wakes every hour; each job runs
  # once per business day (JobRun table). Same image as the app; migrations are applied by the app container.
  jobs:
    build: .
    container_name: jamejam-prod-jobs
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://jamejam:${POSTGRES_PASSWORD}@db:5432/jamejam?schema=public
      TZ: Asia/Dubai
    command: ["sh", "-c", "sleep 120; while true; do npx tsx scripts/run-jobs.ts; sleep 3600; done"]

volumes:
  jamejam-prod-pgdata:
