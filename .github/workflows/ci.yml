# CI (TQ-01): typecheck, lint, unit/integration tests against a disposable PostgreSQL, migration drift, build,
# dependency audit, and the Playwright E2E flows. Runs on every push and pull request. Never deploys.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: erp

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Disposable service database; the names follow the local convention (_test, _e2e) that the tools check.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/jamejam_ci?schema=public
  TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jamejam_test?schema=public
  SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/jamejam_shadow?schema=public

jobs:
  verify:
    name: Typecheck, lint, tests, drift, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jamejam_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (Vitest, resets jamejam_test)
        run: npm test
      - name: Migration drift (schema = migrations)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Build
        run: npm run build
      - name: Dependency audit (production dependencies, high and above fail the build)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/jamejam_e2e?schema=public
      E2E_PASSWORD: ci-e2e-only-4417
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jamejam_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare the E2E database
        run: |
          DATABASE_URL="$E2E_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" SEED_PASSWORD="$E2E_PASSWORD" npx prisma db seed
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            erp/e2e/.report
            erp/e2e/.artifacts
          retention-days: 7
